name: Organize R2 media
on:
  workflow_dispatch:
    inputs:
      environment:
        description: Bucket to organize using the reviewed media catalog
        type: choice
        options: [staging, production]
        required: true
permissions:
  contents: read
concurrency:
  group: organize-r2-${{ inputs.environment }}
  cancel-in-progress: false
jobs:
  organize:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: ${{ inputs.environment }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      MEDIA_ENV: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/organize-r2-media.mjs "$MEDIA_ENV" --apply
      - uses: actions/upload-artifact@v4
        with:
          name: media-organization-${{ inputs.environment }}
          path: docs/cloudflare/organization-${{ inputs.environment }}.json
          if-no-files-found: error
