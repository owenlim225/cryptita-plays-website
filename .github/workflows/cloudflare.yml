name: Cloudflare deployment
on:
  push:
    branches: [main, staging]
  workflow_dispatch:
    inputs:
      full_media_verification:
        description: Download every mapped media URL and verify its SHA-256 checksum
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: cloudflare-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref_name == 'main' || github.ref_name == 'staging'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: ${{ github.ref_name == 'main' && 'production' || 'staging' }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      DEPLOY_ENV: ${{ github.ref_name == 'main' && 'production' || 'staging' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run cf:types
      - run: npm run check
      - run: node --experimental-strip-types --test scripts/media.test.mjs
      - run: npm run build:cloudflare
      - run: npx wrangler deploy --env "$DEPLOY_ENV"
      - name: Check live routes and assets
        env:
          FULL_MEDIA_VERIFICATION: ${{ inputs.full_media_verification }}
        run: |
          if [ "$FULL_MEDIA_VERIFICATION" = "true" ]; then
            node scripts/verify-cloudflare.mjs "$DEPLOY_ENV" --full
          else
            node scripts/verify-cloudflare.mjs "$DEPLOY_ENV"
          fi
      - name: Save full media verification report
        if: inputs.full_media_verification == true
        uses: actions/upload-artifact@v4
        with:
          name: media-verification-${{ env.DEPLOY_ENV }}
          path: docs/cloudflare/verification-${{ env.DEPLOY_ENV }}.json
          if-no-files-found: error
